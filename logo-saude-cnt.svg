<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ícone médico -->
  <g transform="translate(10, 10)">
    <!-- Cruz médica -->
    <rect x="15" y="5" width="10" height="30" fill="url(#logoGradient)" rx="2"/>
    <rect x="5" y="15" width="30" height="10" fill="url(#logoGradient)" rx="2"/>
    <!-- Círculo de fundo -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  </g>
  
  <!-- Texto Saúde CNT -->
  <text x="60" y="25" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">
    Saúde CNT
  </text>
  <text x="60" y="40" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280">
    Tecnologia em Saúde
  </text>
</svg>